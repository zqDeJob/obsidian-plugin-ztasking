  <style>
    :root {
      --bg: #ffffff; --raised: #f4f4f4; --ink: #1a1a1a; --muted: #6b6b6b;
      --line: #ebe0d6; --teal: #d17a45; --teal-soft: #f8eee6;
      --copper: #c46b3a; --gold: #8a6d1f;
      --font: "Noto Sans SC", "PingFang SC", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --display: "Syne", "Noto Sans SC", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: var(--font); background: #fff; color: var(--ink); user-select: text; }
    button, .chip { user-select: none; cursor: pointer; }
    .obsidian { width: 100vw; height: 100vh; display: grid; grid-template-columns: 48px 1fr; overflow: hidden; }
    .ribbon {
      background: #f7f7f7; display: flex; flex-direction: column; align-items: center;
      padding: 10px 0; gap: 8px; border-right: 1px solid var(--line);
    }
    .ribbon button {
      width: 32px; height: 32px; border: 0; background: transparent; color: var(--muted);
      border-radius: 6px; font-size: 15px;
    }
    .ribbon button.active { background: #fff; color: var(--teal); box-shadow: inset 2px 0 0 var(--teal); }
    .app { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
    header {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
      border-bottom: 1px solid var(--line); background: #fff; flex-wrap: wrap;
    }
    .brand { font-family: var(--display); font-weight: 800; letter-spacing: .04em; font-size: 16px; }
    .brand span { color: var(--teal); margin-left: 8px; font-size: 12px; font-family: var(--font); font-weight: 500; letter-spacing: 0; }
    .tabs { display: flex; gap: 4px; }
    .tabs button, .period button, .chip, .btn, .ghost { font-family: inherit; }
    .tabs button { background: transparent; border: 0; color: var(--muted); padding: 6px 12px; border-radius: 6px; font-size: 13px; }
    .tabs button.on { background: var(--raised); color: var(--ink); }
    .spacer { flex: 1; }
    .period {
      display: flex; align-items: center; gap: 6px; padding: 3px;
      background: var(--teal-soft); border: 1px solid #f0e2d6;
      border-radius: 999px; flex-wrap: nowrap;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.65);
    }
    .period.is-hidden { display: none; }
    .period-presets { display: flex; align-items: center; gap: 2px; }
    .period button {
      border: 0; background: transparent; color: var(--muted);
      padding: 5px 12px; font-size: 12px; font-weight: 550;
      border-radius: 999px; line-height: 1.2;
    }
    .period button:hover { background: rgba(255,255,255,.72); color: var(--ink); }
    .period button.on { background: var(--teal); color: #fff; box-shadow: 0 1px 2px rgba(209,122,69,.28); }
    .period-custom {
      display: flex; align-items: center; gap: 4px;
      padding: 2px 8px 2px 4px; margin-left: 2px;
      border-left: 1px solid rgba(209,122,69,.22);
      border-radius: 0 999px 999px 0;
    }
    .period.is-custom .period-custom { background: rgba(255,255,255,.78); }
    .period-sep { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--muted); padding: 0 4px 0 8px; white-space: nowrap; }
    .period.is-custom .period-sep { color: var(--teal); }
    .period-tilde { font-size: 12px; color: var(--muted); padding: 0 1px; }
    .period input[type="date"] {
      width: auto; min-width: 8.2em; border: 1px solid transparent; border-radius: 999px;
      padding: 3px 8px; font-size: 12px; background: rgba(255,255,255,.55); color: var(--ink);
    }
    .period.is-custom input[type="date"] { background: #fff; border-color: #edd9c8; }
    .btn { border: 0; background: var(--teal); color: #fff; font-weight: 600; padding: 7px 12px; border-radius: 8px; font-size: 13px; }
    .btn-danger { border: 0; background: #d32f2f; color: #fff; font-weight: 600; padding: 4px 10px; border-radius: 8px; font-size: 12px; }
    .ghost { background: #fff; border: 1px solid var(--line); color: var(--ink); padding: 7px 12px; border-radius: 8px; font-size: 13px; }
    main { min-height: 0; overflow: hidden; }
    .view { height: 100%; display: none !important; min-height: 0; }
    .view.on { display: grid !important; }

    #view-board { grid-template-columns: 320px 1fr; }
    .list-pane, .detail-pane, .gantt-pane, .cal-grid, .day-pane { min-height: 0; overflow: auto; }

    .filters {

    .catalog-bar {

    .side-tabs {

    .hours-badge {
      display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px;

    .log time { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .log-body { min-width: 0; white-space: pre-wrap; line-height: 1.65; }
    .log-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: flex-start; }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; padding: 0; border: 0; border-radius: 8px; cursor: pointer;
    }
    .icon-btn svg { display: block; pointer-events: none; }
    .icon-btn--copy { background: #f8eee6; color: #d17a45; }
    .icon-btn--edit { background: #f3ebe3; color: #a85a2a; }
    .icon-btn--del { background: #d32f2f; color: #fff; }
    .icon-btn--del:hover { background: #b71c1c; }
    .icon-btn--save { background: #d17a45; color: #fff; }

    .muted { color: var(--muted); }
    .empty { color: var(--muted); display: grid; place-items: center; height: 100%; padding: 20px; }

    #view-list { grid-template-rows: auto 1fr; }

    #view-list table tr:hover { background: var(--teal-soft); }

    #view-cal { grid-template-columns: 1.4fr .8fr; }

    .weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); }
    .weekdays { padding: 6px 10px 0; color: var(--muted); font-size: 12px; text-align: center; }
    .days { padding: 8px 10px 16px; gap: 6px; }
    .day { min-height: 92px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; cursor: pointer; }

    .day.today { border-color: var(--teal); }
    .day.sel { background: var(--teal-soft); border-color: var(--teal); }
    .day-num { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .day-item { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
    .day-pane { border-left: 1px solid var(--line); padding: 16px; }
    .day-pane h2 { margin: 0 0 12px; font-size: 16px; }
    .day-log {
      display: grid; gap: 6px; padding: 10px 0; border-bottom: 1px dashed var(--line);

    .day-log .ghost { justify-self: start; max-width: 100%; white-space: normal; text-align: left; height: auto; line-height: 1.4; }

    #view-gantt { grid-template-rows: auto minmax(0, 1fr) auto; }
    .gantt-hint { padding: 8px 16px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); }
    .gantt-pane { overflow: auto; min-height: 120px; }
    .gantt { display: grid; grid-template-columns: 200px 1fr; min-width: 720px; }
    .gantt-head { height: 36px; display: flex; align-items: flex-end; font-family: var(--mono); font-size: 10px; color: var(--muted); border-bottom: 1px solid var(--line); }
    .gantt-row, .gantt-track { height: 44px; border-bottom: 1px solid var(--line); }
    .gantt-row { display: flex; align-items: center; padding: 0 12px; font-size: 13px; cursor: pointer; }
    .gantt-row.sel { background: var(--teal-soft); }
    .gantt-track { position: relative; }
    .bar { position: absolute; top: 12px; height: 20px; border-radius: 4px; background: var(--teal-soft); border: 1px solid var(--teal); }
    .bar.temp { border-style: dashed; border-color: var(--copper); background: #f8eee8; }
    .bar.todo { opacity: .45; }
    .bar.done { border-color: var(--gold); background: #f4efe2; }
    .tick { position: absolute; top: -4px; width: 3px; height: 28px; background: var(--ink); border-radius: 1px; }
    .today-line { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--copper); pointer-events: none; }
    .col { flex: 1; text-align: center; min-width: 28px; }
    .gantt-logs { border-top: 1px solid var(--line); padding: 10px 16px 14px; max-height: 180px; overflow: auto; }

    #view-report { padding: 14px; overflow: auto; align-content: start; gap: 12px; grid-template-columns: 1.2fr .8fr; }
    .today-card { grid-column: 1 / -1; }
    .today-item { display: grid; gap: 6px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
    .today-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .today-item:last-child { border-bottom: 0; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .card h2 { margin: 0 0 10px; font-size: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .heat { display: grid; grid-template-columns: repeat(auto-fill, 14px); gap: 4px; }
    .heat i { width: 14px; height: 14px; border-radius: 3px; background: #f0f0f0; display: block; }
    .heat i.l1 { background: #f3d9c4; }
    .heat i.l2 { background: #e4a875; }
    .heat i.l3 { background: #d17a45; }
    .toast {
      position: fixed; right: 16px; bottom: 16px; background: var(--ink); color: #fff;
      padding: 8px 12px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .toast.on { opacity: 1; }

    dialog { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 14px; padding: 0; width: min(480px, 92vw); }
    dialog::backdrop { background: rgba(0,0,0,.35); }
    .modal { padding: 18px; }
    .modal h2 { margin: 0 0 14px; }
    .form { display: grid; gap: 10px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

    @media (max-width: 960px) {
      #view-board, #view-cal, #view-report { grid-template-columns: 1fr; }
    }
  </style>
</head>

    async function copyText(text) {
      const value = String(text || "").replace(/^\s+|\s+$/g, "");
      if (!value) return false;
      try {
        await navigator.clipboard.writeText(value);
        return true;
      } catch {
        const ta = document.createElement("textarea");
        ta.value = value;
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        ta.remove();
        return ok;

    }

    function normalizeDateRange(startStr, endStr) {
      let start = parse(startStr);
      let end = parse(endStr);
      if (Number.isNaN(+start) || Number.isNaN(+end)) {
        start = parse(TODAY);
        end = parse(TODAY);
      }
      if (start > end) { const t = start; start = end; end = t; }
      return { start, end, startStr: fmt(start), endStr: fmt(end), label: "??", preset: "custom" };
    }

    function resolvePeriodRange(preset, todayStr = TODAY) {
      const t = parse(todayStr);
      if (preset === "week") {
        const day = (t.getDay() + 6) % 7;
        const start = addDays(t, -day);
        const end = addDays(start, 6);
        return { start, end, startStr: fmt(start), endStr: fmt(end), label: "??", preset };
      }
      if (preset === "month") {
        const start = new Date(t.getFullYear(), t.getMonth(), 1);
        const end = new Date(t.getFullYear(), t.getMonth() + 1, 0);
        return { start, end, startStr: fmt(start), endStr: fmt(end), label: "??", preset };
      }
      if (preset === "quarter") {
        const q = Math.floor(t.getMonth() / 3) * 3;
        const start = new Date(t.getFullYear(), q, 1);
        const end = new Date(t.getFullYear(), q + 3, 0);
        return { start, end, startStr: fmt(start), endStr: fmt(end), label: "??", preset };
      }
      const start = new Date(t.getFullYear(), 0, 1);
      const end = new Date(t.getFullYear(), 11, 31);
      return { start, end, startStr: fmt(start), endStr: fmt(end), label: "??", preset };
    }

    function matchPeriodPreset(startStr, endStr) {
      const custom = normalizeDateRange(startStr, endStr);
      for (const p of SHORTCUTS) {
        const r = resolvePeriodRange(p);
        if (r.startStr === custom.startStr && r.endStr === custom.endStr) return p;
      }
      return "custom";
    }

    function ganttScaleForDays(days) {
      if (days <= 31) return "day";
      if (days <= 120) return "week";
      return "month";
    }

    function buildGanttUnits(startStr, endStr, scale) {
      const range = normalizeDateRange(startStr, endStr);
      const units = [];
      if (scale === "day") {
        for (let d = new Date(range.start); d <= range.end; d = addDays(d, 1)) {
          units.push({ start: new Date(d), end: new Date(d), label: String(d.getDate()) });
        }
        return units;
      }
      if (scale === "week") {
        let d = new Date(range.start);
        d = addDays(d, -((d.getDay() + 6) % 7));
        while (d <= range.end) {
          units.push({ start: new Date(d), end: addDays(d, 6), label: `${d.getMonth() + 1}/${d.getDate()}` });
          d = addDays(d, 7);
        }
        return units;
      }
      let cursor = new Date(range.start.getFullYear(), range.start.getMonth(), 1);
      while (cursor <= range.end) {
        units.push({
          start: new Date(cursor),
          end: new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0),
          label: `${cursor.getMonth() + 1}?`,
        });
        cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
      }
      return units;
    }

    function periodRange() {
      const r = normalizeDateRange(rangeStart || TODAY, rangeEnd || TODAY);
      const preset = matchPeriodPreset(r.startStr, r.endStr);
      if (preset !== "custom") {
        const named = resolvePeriodRange(preset);
        return { ...r, label: named.label, preset };
      }
      return { ...r, label: "??", preset: "custom" };
    }

      $("#ganttHint").textContent = `${r.startStr} ? ${r.endStr} � ${r.label} � ${scaleHint}`;
      const today = parse(TODAY);
      const todayIdx = units.findIndex((u) => today >= u.start && today <= u.end);
      const todayPct = todayIdx < 0 || !units.length ? -1 : ((todayIdx + 0.5) / units.length) * 100;
      const rows = filtered();

          ${todayPct >= 0 ? `<div class="today-line" style="left:${todayPct}%"></div>` : ""}
          <div class="gantt-head">${units.map((u) => `<div class="col">${u.label}</div>`).join("")}</div>
          ${rows.map((t) => {
            const ts = parse(t.start || r.startStr);
            const te = parse(t.end || r.endStr);
            let startIdx = units.findIndex((u) => te >= u.start && ts <= u.end);
            let endIdx = startIdx;
            for (let i = 0; i < units.length; i++) {
              const u = units[i];
              if (ts <= u.end && te >= u.start) endIdx = i;
            }
            if (startIdx < 0 || !units.length) return `<div class="gantt-track" data-gid="${t.id}"></div>`;
            const left = (startIdx / units.length) * 100;
            const width = Math.max(1.5, ((endIdx - startIdx + 1) / units.length) * 100);
            const ticks = t.logs.map((l) => {
              const d = parse(l.date);
              const i = units.findIndex((u) => d >= u.start && d <= u.end);
              if (i < 0) return "";
              const p = ((i - startIdx + 0.4) / Math.max(1, endIdx - startIdx + 1)) * 100;
              return `<i class="tick" title="${esc(l.date)}: ${esc(l.text)}" style="left:${Math.min(96, Math.max(2, p))}%"></i>`;
            }).join("");
            return `<div class="gantt-track" data-gid="${t.id}"><div class="bar ${t.type} ${t.status}" style="left:${left}%;width:${width}%">${ticks}</div></div>`;
          }).join("")}

      const logs = focus ? focus.logs.filter((l) => inRange(l.date, r)).sort((a, b) => b.date.localeCompare(a.date)) : [];
      $("#ganttLogs").innerHTML = focus
        ? `<strong>${esc(focus.title)} � ${r.label}????</strong>${logs.map((l) => `<div class="log"><time>${esc(l.date)}</time><div class="log-body">${esc(l.text)}</div></div>`).join("") || `<p class="muted">?????????</p>`}`
        : "";
    }

    function renderReport() {
      const r = periodRange();
      const todayLogs = logsOn(TODAY);
      const logs = logsInPeriod().sort((a, b) => b.date.localeCompare(a.date));
      const byTask = {};
      for (const l of logs) byTask[l.task.title] = (byTask[l.task.title] || 0) + 1;
      const countByDay = {};
      for (const l of logs) countByDay[l.date] = (countByDay[l.date] || 0) + 1;
      const heatDays = daysBetween(r.start, r.end) + 1;
      let heat = "";
      for (let i = 0; i < Math.min(heatDays, 370); i++) {
        const d = fmt(addDays(r.start, i));
        const n = countByDay[d] || 0;
        heat += `<i class="${n >= 3 ? "l3" : n === 2 ? "l2" : n === 1 ? "l1" : ""}" title="${d} � ${n} ?"></i>`;
      }
      const todayHtml = todayLogs.length
        ? todayLogs.map((l) => `<div class="today-item">
            <div class="today-head">
              <button class="ghost" data-act="goto-task" data-id="${l.task.id}" type="button">${esc(l.task.title)}</button>
              <button class="ghost" data-act="copy-text" data-text="${esc(l.text)}" type="button">??</button>
            </div>
            <div class="log-body">${esc(l.text)}</div>
          </div>`).join("")
        : `<p class="muted">????????</p>`;
      $("#view-report").innerHTML = `
        <div class="card today-card">
          <h2>???? � ${TODAY} � ${todayLogs.length} ?</h2>
          ${todayHtml}
        </div>
        <div class="card">
          <h2>${r.label}????</h2>
          <table>
            <thead><tr><th>??</th><th>??</th><th>????</th></tr></thead>
            <tbody>${logs.map((l) => `<tr><td>${esc(l.date)}</td><td>${esc(l.task.title)}</td><td class="log-body">${esc(l.text)}</td></tr>`).join("") || `<tr><td colspan="3">?????????</td></tr>`}</tbody>
          </table>
        </div>
        <div>
          <div class="card" style="margin-bottom:12px"><h2>????</h2><div class="heat">${heat}</div></div>
          <div class="card"><h2>?????</h2><table>${Object.entries(byTask).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v} ?</td></tr>`).join("") || "<tr><td>??</td></tr>"}</table></div>
        </div>
      `;
    }

    function topTabFor(next) {
      if (next === "report") return "report";
      if (next === "cal" || next === "gantt") return "schedule";
      return "work";
    }

    function switchTopTab(tab) {
      if (tab === "report") switchView("report");
      else if (tab === "work") switchView(workMode);
      else switchView(scheduleMode);
    }

    function switchView(next) {
      view = next;
      if (next === "board" || next === "list") workMode = next;
      if (next === "cal" || next === "gantt") scheduleMode = next;
      const tabView = topTabFor(next);
      [...$("#tabs").children].forEach((b) => b.classList.toggle("on", b.dataset.tab === tabView));
      ["board", "list", "cal", "gantt", "report"].forEach((v) => $("#view-" + v).classList.toggle("on", v === next));
      syncPeriodVisibility();
      syncPeriodControls();
      if (next === "board") { renderSidebarChrome(); renderList(); renderDetail(); }
      if (next === "list") { renderFilters(); renderCatalog(); }
      if (next === "cal") renderCalendar();
      if (next === "gantt") renderGantt();
      if (next === "report") renderReport();
    }

    function renderAll() {
      syncPeriodVisibility();
      syncPeriodControls();
      renderSidebarChrome();
      renderFilters();
      renderList();
      renderCatalog();
      renderDetail();
      renderCalendar();
      renderGantt();
      renderReport();
    }

    function selectedTask() {
      return tasks.find((t) => t.id === selectedId);
    }

    $("#tabs").onclick = (e) => {
      const btn = e.target.closest("button[data-tab]");
      if (!btn) return;
      switchTopTab(btn.dataset.tab);
    };

    $("#period").onclick = (e) => {
      const btn = e.target.closest("button[data-p]");
      if (!btn || !SHORTCUTS.includes(btn.dataset.p)) return;
      applyPeriodShortcut(btn.dataset.p);
      renderGantt();
      renderReport();
    };

    $("#rangeStart").onchange = $("#rangeEnd").onchange = () => {
      applyCustomRangeFromInputs();
      renderGantt();
      renderReport();
    };

    document.addEventListener("click", async (e) => {
      const selected = window.getSelection()?.toString() || "";
      if (selected && !e.target.closest("button, a, textarea, input, select, [data-act]")) return;

      const actEl = e.target.closest("[data-act]");
      if (actEl?.dataset.act) {
        const a = actEl.dataset.act;
        if (a === "open-list") { switchView("list"); return; }
        if (a === "goto-gantt") { switchView("gantt"); return; }
        if (a === "goto-cal") { switchView("cal"); return; }
        if (a === "goto-task" && actEl.dataset.id) {
          selectedId = actEl.dataset.id;
          editingDesc = false;
          editingTitle = false;
          switchView("board");
          renderList();
          renderDetail();
          return;
        }
        if (a === "edit-title") { editingTitle = true; renderDetail(); return; }
        if (a === "cancel-title") { editingTitle = false; renderDetail(); return; }
        if (a === "save-title") {
          const t = selectedTask();
          const title = ($("#titleInput")?.value || "").trim();
          if (!title) { toast("??????"); return; }
          if (t) { t.title = title; touch(t); }
          editingTitle = false;
          renderAll();
          toast("?????");
          return;
        }
        if (a === "copy-desc") {
          const ok = await copyText(selectedTask()?.desc || "");
          toast(ok ? "?????" : "????");
          return;
        }
        if (a === "edit-desc") { editingDesc = true; renderDetail(); return; }
        if (a === "cancel-desc") { editingDesc = false; renderDetail(); return; }
        if (a === "save-desc") {
          const t = selectedTask();
          if (t) { t.desc = ($("#descText")?.value || "").trim(); touch(t); }
          editingDesc = false;
          renderDetail();
          toast("?????");
          return;
        }
        if (a === "copy-log") {
          const date = actEl.closest("[data-date]")?.dataset.date;
          const text = selectedTask()?.logs.find((l) => l.date === date)?.text || "";
          toast((await copyText(text)) ? "?????" : "????");
          return;
        }
        if (a === "edit-log") {
          editingLogDate = actEl.closest("[data-date]")?.dataset.date || null;
          renderDetail();
          return;
        }
        if (a === "cancel-log") { editingLogDate = null; renderDetail(); return; }
        if (a === "save-log") {
          const date = actEl.closest("[data-date]")?.dataset.date;
          const t = selectedTask();
          const row = actEl.closest(".log");
          const text = (row?.querySelector("textarea")?.value || "").trim();
          const hours = parseHoursInput(row?.querySelector(".log-hours-edit")?.value || "");
          if (!text) { toast("????????"); return; }
          if (hours === null) { toast("?????????????? 0?"); return; }
          if (t && date) {
            const log = t.logs.find((l) => l.date === date);
            if (log) { log.text = text; log.hours = hours; }
            touch(t);
          }
          editingLogDate = null;
          renderAll();
          toast("?????");
          return;
        }
        if (a === "del-log") {
          const date = actEl.closest("[data-date]")?.dataset.date;
          const t = selectedTask();
          if (!date || !t || !confirm(`?? ${date} ?????`)) return;
          t.logs = t.logs.filter((l) => l.date !== date);
          touch(t);
          if (editingLogDate === date) editingLogDate = null;
          renderAll();
          toast("?????");
          return;
        }
        if (a === "copy-text") {
          toast((await copyText(actEl.dataset.text || "")) ? "???" : "????");
          return;
        }
      }

      const chip = e.target.closest(".chip[data-k]");
      if (chip) {
        typeFilter = chip.dataset.k;
        renderFilters();
        renderCatalog();
        return;
      }

      const workModeBtn = e.target.closest("[data-work-mode]");
      if (workModeBtn?.dataset.workMode === "board" || workModeBtn?.dataset.workMode === "list") {
        switchView(workModeBtn.dataset.workMode);
        return;
      }

      const taskEl = e.target.closest(".task[data-id]");
      if (taskEl && view === "board") {
        if (selectedId !== taskEl.dataset.id) {
          editingDesc = false;
          editingLogDate = null;
        }
        selectedId = taskEl.dataset.id;
        renderList();
        renderDetail();
        return;
      }

      const day = e.target.closest(".day[data-day]");
      if (day) {
        selectedDay = day.dataset.day;
        renderCalendar();
        return;
      }

      const grow = e.target.closest("[data-gid]");
      if (grow) {
        ganttTaskId = grow.dataset.gid;
        renderGantt();
      }
    });

    document.addEventListener("contextmenu", (e) => {
      const titleEl = e.target.closest(".detail-title");
      if (!titleEl) return;
      e.preventDefault();
      editingTitle = true;
      renderDetail();
      $("#titleInput")?.focus();
    });

    document.addEventListener("change", (e) => {
      if (e.target.classList.contains("side-type")) {
        if (e.target.value === "long" || e.target.value === "temp") {
          sidebarType = e.target.value;
          renderList();
        }
        return;
      }
      if (e.target.classList.contains("side-status")) {
        sidebarStatus = e.target.value;
        renderList();
        return;
      }
      if (e.target.classList.contains("status-filter")) {
        statusFilter = e.target.value;
        renderFilters();
        renderCatalog();
      }
      if (e.target.id === "taskStatus") {
        const t = selectedTask();
        const next = e.target.value;
        if (!t || t.status === next) return;
        if (!confirm(`????????${STATUS[next]}??`)) {
          e.target.value = t.status;
          return;
        }
        t.status = next;
        touch(t);
        renderAll();
      }
      if (e.target.id === "taskType") {
        const t = selectedTask();
        const next = e.target.value;
        if (!t || t.type === next) return;
        if (!confirm(`????????${TYPE[next]}??`)) {
          e.target.value = t.type;
          return;
        }
        t.type = next;
        touch(t);
        renderAll();
      }
    });

    document.addEventListener("input", (e) => {
      if (e.target.classList.contains("search")) {
        query = e.target.value;
        renderCatalog();
      }
    });

    $("#calPrev").onclick = () => { calCursor.setMonth(calCursor.getMonth() - 1); renderCalendar(); };
    $("#calNext").onclick = () => { calCursor.setMonth(calCursor.getMonth() + 1); renderCalendar(); };
    $("#calToday").onclick = () => { calCursor = new Date(); selectedDay = TODAY; renderCalendar(); };

    document.addEventListener("click", (e) => {
      if (e.target.id === "addLog") {
        const t = selectedTask();
        const text = ($("#logText")?.value || "").trim();
        const hours = parseHoursInput($("#logHours")?.value || "");
        if (!t || !text) { toast("???????"); return; }
        if (hours === null) { toast("?????????????? 0?"); return; }
        const existing = t.logs.find((l) => l.date === TODAY);
        if (!existing) {
          t.logs.push({ date: TODAY, text, hours });
        } else {
          const prev = (existing.text || "").trim();
          existing.text = prev ? `${prev}\n\n${text}` : text;
          existing.hours = Math.round(((existing.hours || 0) + hours) * 1000) / 1000;
        }
        if (t.status === "todo") t.status = "doing";
        touch(t);
        renderAll();
        toast("???????");
      }
    });

    $("#newBtn").onclick = () => {
      const form = $("#newForm");
      form.start.value = TODAY;
      form.end.value = fmt(addDays(new Date(), 14));
      $("#modal").showModal();
    };
    $("#cancelBtn").onclick = () => $("#modal").close();
    $("#newForm").onsubmit = (e) => {
      e.preventDefault();
      const f = e.target;
      const id = "t" + Date.now();
      tasks.unshift({
        id,
        title: f.title.value.trim(),
        desc: f.desc.value.trim(),
        type: f.type.value,
        status: f.status.value,
        start: f.start.value,
        end: f.end.value,
        logs: [],
        updatedAt: Date.now(),
      });
      selectedId = id;
      $("#modal").close();
      f.reset();
      switchView("board");
      renderAll();
      toast("?????");
    };

    applyPeriodShortcut("week");
    renderAll();
  </script>
</body>
</html>
