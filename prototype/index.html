<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
          <title>Z-Tasking · 任务台原型</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --raised: #f4f4f4;
      --ink: #1a1a1a;
      --muted: #6b6b6b;
      --line: #e6e6e6;
      --teal: #2f6f68;
      --teal-soft: #e7f2f0;
      --copper: #c46b3a;
      --gold: #8a6d1f;
      --todo: #6b6b6b;
      --doing: #2f6f68;
      --done: #8a6d1f;
      --font: "Noto Sans SC", "PingFang SC", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --display: "Syne", "Noto Sans SC", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font);
      background: #ffffff;
      color: var(--ink);
    }

    .obsidian {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: 48px 1fr;
      background: #ffffff;
      overflow: hidden;
    }

    .ribbon {
      background: #f7f7f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      gap: 8px;
      border-right: 1px solid var(--line);
    }
    .ribbon button {
      width: 32px; height: 32px;
      border: 0; background: transparent; color: var(--muted);
      border-radius: 6px; cursor: pointer; font-size: 15px;
    }
    .ribbon button.active {
      background: #ffffff;
      color: var(--teal);
      box-shadow: inset 2px 0 0 var(--teal);
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 0;
      min-height: 0;
      background: #ffffff;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }
    .brand {
      font-family: var(--display);
      font-weight: 800;
      letter-spacing: .04em;
      font-size: 18px;
    }
    .brand span { color: var(--teal); margin-left: 8px; font-size: 13px; letter-spacing: 0; font-family: var(--font); font-weight: 500; }
    .tabs { display: flex; gap: 4px; margin-left: 8px; }
    .tabs button, .period button, .chip, .btn, .ghost {
      font-family: inherit; cursor: pointer;
    }
    .tabs button {
      background: transparent; border: 0; color: var(--muted);
      padding: 6px 12px; border-radius: 6px; font-size: 13px;
    }
    .tabs button.on { background: var(--raised); color: var(--ink); }
    .spacer { flex: 1; }
    .period { display: flex; background: #ffffff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .period.is-hidden { display: none; }
    .period button {
      border: 0; background: transparent; color: var(--muted);
      padding: 6px 12px; font-size: 12px;
    }
    .period button.on { background: var(--teal); color: #fff; }
    .btn {
      border: 0; background: var(--teal); color: #fff;
      font-weight: 600; padding: 8px 14px; border-radius: 8px; font-size: 13px;
    }
    .btn-danger {
      border: 0; background: #c45c4a; color: #fff;
      font-weight: 600; padding: 8px 14px; border-radius: 8px; font-size: 13px;
    }
    .ghost {
      background: #ffffff; border: 1px solid var(--line); color: var(--ink);
      padding: 7px 12px; border-radius: 8px; font-size: 13px;
    }

    main { min-height: 0; overflow: hidden; background: #ffffff; }
    .view { height: 100%; display: none; background: #ffffff; }
    .view.on { display: grid; }

    #view-board { grid-template-columns: 340px 1fr; }
    .list-pane, .detail-pane, .gantt-pane, .cal-grid, .day-pane {
      min-height: 0; overflow: auto; background: #ffffff;
    }
    .list-pane { border-right: 1px solid var(--line); }
    .filters {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 12px 14px; border-bottom: 1px solid var(--line);
    }
    .chip {
      border: 1px solid var(--line); background: #ffffff; color: var(--muted);
      border-radius: 999px; padding: 4px 10px; font-size: 12px;
    }
    .chip.on { color: var(--teal); border-color: var(--teal); background: var(--teal-soft); }
    .filters select, .status-box select {
      width: auto; min-width: 108px;
    }
    .group-title {
      padding: 8px 16px 4px; color: var(--muted); font-size: 11px;
      letter-spacing: .12em;
    }
    .task {
      display: grid; grid-template-columns: 4px 1fr auto;
      gap: 10px; margin: 6px 10px; padding: 10px 12px;
      background: #ffffff; border: 1px solid var(--line); border-radius: 10px;
      cursor: pointer;
    }
    .task:hover { border-color: #cfcfcf; }
    .task.sel { border-color: var(--teal); background: var(--teal-soft); }
    .rail { border-radius: 4px; }
    .rail.long { background: var(--teal); }
    .rail.temp { background: var(--copper); }
    .task h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
    .meta { color: var(--muted); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .st {
      font-size: 11px; padding: 2px 6px; border-radius: 4px;
      font-family: var(--mono); background: var(--raised);
    }
    .st.todo { color: var(--todo); }
    .st.doing { color: var(--doing); background: var(--teal-soft); }
    .st.done { color: var(--done); background: #f4efe2; }
    .need { width: 8px; height: 8px; border-radius: 50%; background: var(--copper); margin-top: 6px; }

    .detail-pane { padding: 18px 22px 32px; }
    .detail-head { display: flex; align-items: flex-start; gap: 16px; }
    .detail-head h1 { flex: 1; margin: 6px 0 10px; font-size: 24px; }
    .status-box {
      margin-top: 4px;
      display: grid;
      gap: 6px;
      min-width: 120px;
    }
    .status-box label { font-size: 12px; color: var(--muted); }
    .detail-empty { color: var(--muted); display: grid; place-items: center; height: 100%; }
    .kicker { font-family: var(--mono); font-size: 11px; color: var(--teal); letter-spacing: .08em; }
    .desc {
      color: #333; line-height: 1.7; font-size: 14px;
      border-left: 2px solid var(--teal); padding-left: 12px; margin: 12px 0 20px;
    }
    .composer {
      background: var(--raised); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px;
    }
    .composer label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    textarea, input, select {
      width: 100%; font-family: inherit; color: var(--ink);
      background: #ffffff; border: 1px solid var(--line); border-radius: 8px;
      padding: 8px 10px; font-size: 13px;
    }
    select {
      height: auto; min-height: 32px; line-height: 1.5;
      padding: 2px 28px 2px 10px;
    }
    textarea { min-height: 72px; resize: vertical; }
    .composer-row { display: flex; justify-content: flex-end; margin-top: 8px; }
    .timeline { margin-top: 22px; }
    .log {
      display: grid; grid-template-columns: 92px 1fr auto;
      gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--line);
      align-items: start;
    }
    .log time { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 4px; }
    .log p { margin: 0; font-size: 14px; line-height: 1.6; }
    .log-body { min-width: 0; }
    .log-edit { min-height: 64px; }
    .log-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .log-actions button { padding: 4px 10px; font-size: 12px; }

    #view-cal { grid-template-columns: 1.4fr .8fr; }
    .cal-toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); }
    .weekdays { padding: 6px 10px 0; color: var(--muted); font-size: 12px; text-align: center; }
    .days { padding: 8px 10px 16px; gap: 6px; }
    .day {
      min-height: 92px; border: 1px solid var(--line); border-radius: 8px;
      padding: 6px 8px; background: #ffffff; cursor: pointer;
    }
    .day.out { opacity: .35; }
    .day.today { border-color: var(--teal); }
    .day.sel { background: var(--teal-soft); border-color: var(--teal); }
    .day-num { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .day-item { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
    .day-pane { border-left: 1px solid var(--line); padding: 16px; }
    .day-pane h2 { margin: 0 0 12px; font-size: 16px; }

    #view-gantt { grid-template-rows: auto 1fr auto; }
    .gantt-toolbar { padding: 10px 16px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); }
    .gantt-pane { overflow: auto; }
    .gantt { display: grid; grid-template-columns: 200px 1fr; min-width: 720px; }
    .gantt-head { height: 36px; display: flex; align-items: flex-end; font-family: var(--mono); font-size: 10px; color: var(--muted); border-bottom: 1px solid var(--line); }
    .gantt-row, .gantt-track { height: 44px; border-bottom: 1px solid var(--line); }
    .gantt-row { display: flex; align-items: center; padding: 0 12px; font-size: 13px; cursor: pointer; }
    .gantt-row.sel { background: var(--teal-soft); }
    .gantt-track { position: relative; }
    .bar {
      position: absolute; top: 12px; height: 20px; border-radius: 4px;
      background: var(--teal-soft); border: 1px solid var(--teal);
    }
    .bar.temp { border-style: dashed; border-color: var(--copper); background: #f8eee8; }
    .bar.todo { opacity: .45; }
    .bar.done { border-color: var(--gold); background: #f4efe2; }
    .tick { position: absolute; top: -4px; width: 3px; height: 28px; background: var(--ink); border-radius: 1px; }
    .today-line { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--copper); pointer-events: none; }
    .col { flex: 1; text-align: center; min-width: 28px; }
    .gantt-logs { border-top: 1px solid var(--line); padding: 10px 16px 14px; max-height: 180px; overflow: auto; background: #ffffff; }

    #view-report { padding: 14px; overflow: auto; align-content: start; gap: 12px; grid-template-columns: 1.2fr .8fr; }
    .card { background: #ffffff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .card h2 { margin: 0 0 10px; font-size: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; }
    .heat { display: grid; grid-template-columns: repeat(auto-fill, 14px); gap: 4px; }
    .heat i { width: 14px; height: 14px; border-radius: 3px; background: #f0f0f0; display: block; }
    .heat i.l1 { background: #cfe3df; }
    .heat i.l2 { background: #7eb8ae; }
    .heat i.l3 { background: #2f6f68; }

    dialog { border: 1px solid var(--line); background: #ffffff; color: var(--ink); border-radius: 14px; padding: 0; width: min(480px, 92vw); }
    dialog::backdrop { background: rgba(0,0,0,.35); }
    .modal { padding: 18px; }
    .modal h2 { margin: 0 0 14px; }
    .form { display: grid; gap: 10px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

    @media (max-width: 960px) {
      #view-board, #view-cal, #view-report { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="obsidian">
    <nav class="ribbon" aria-label="Obsidian 侧边栏">
      <button title="文件">⌘</button>
      <button title="搜索">⌕</button>
      <button class="active" title="Tasking 任务台">☰</button>
      <button title="日记">日</button>
    </nav>
    <section class="app">
      <header>
        <div class="brand">Z-TASKING<span>任务台</span></div>
        <div class="tabs" id="tabs">
          <button data-view="board" class="on">工作台</button>
          <button data-view="cal">日历</button>
          <button data-view="gantt">甘特图</button>
          <button data-view="report">汇总</button>
        </div>
        <div class="spacer"></div>
        <div class="period" id="period">
          <button data-p="week" class="on">周</button>
          <button data-p="month">月</button>
          <button data-p="quarter">季</button>
          <button data-p="year">年</button>
        </div>
        <button class="btn" id="newBtn">新建任务</button>
      </header>

      <main>
        <div class="view on" id="view-board">
          <aside class="list-pane">
            <div class="filters" id="filters"></div>
            <div id="taskList"></div>
          </aside>
          <article class="detail-pane" id="detail"></article>
        </div>

        <div class="view" id="view-cal">
          <div class="cal-grid">
            <div class="cal-toolbar">
              <button class="ghost" id="calPrev">上一月</button>
              <strong id="calTitle"></strong>
              <button class="ghost" id="calNext">下一月</button>
              <button class="ghost" id="calToday">今天</button>
            </div>
            <div class="weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
            <div class="days" id="calDays"></div>
          </div>
          <aside class="day-pane" id="dayPane"></aside>
        </div>

        <div class="view" id="view-gantt">
          <div class="gantt-toolbar" id="ganttHint"></div>
          <div class="gantt-pane" id="gantt"></div>
          <div class="gantt-logs" id="ganttLogs"></div>
        </div>

        <div class="view" id="view-report">
          <div class="report-grid" id="report"></div>
        </div>
      </main>
    </section>
  </div>

  <dialog id="modal">
    <form class="modal" id="newForm">
      <h2>新建任务</h2>
      <div class="form">
        <input name="title" required placeholder="任务标题，例如：Tasking 插件" />
        <textarea name="desc" placeholder="说明：这件长期事项要达成什么"></textarea>
        <div class="two">
          <select name="type">
            <option value="long">长期任务</option>
            <option value="temp">临时任务</option>
          </select>
          <select name="status">
            <option value="todo">未开始</option>
            <option value="doing">进行中</option>
            <option value="done">已完结</option>
          </select>
        </div>
        <div class="two">
          <input type="date" name="start" required />
          <input type="date" name="end" required />
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="ghost" id="cancelNew">取消</button>
        <button class="btn" type="submit">创建</button>
      </div>
    </form>
  </dialog>

  <script>
    const TODAY = "2026-08-13";
    const STATUS = { todo: "未开始", doing: "进行中", done: "已完结" };
    const TYPE = { long: "长期", temp: "临时" };

    let period = "week";
    let typeFilter = "all";
    let statusFilter = "all";
    let selectedId = "t1";
    let view = "board";
    let calCursor = new Date(2026, 7, 1);
    let selectedDay = TODAY;
    let ganttTaskId = "t1";
    let editingLogDate = null;

    let tasks = [
      {
        id: "t1", type: "long", status: "doing",
        title: "Tasking 长期任务插件",
        start: "2026-08-10", end: "2026-09-30",
        desc: "在 Obsidian 里跟踪会持续几周到几个月的事项：新建、每日记进展、日历回看、甘特跨度。",
        logs: [
          { date: "2026-08-11", text: "对比 Tasks / TaskNotes / Work Log，确认没有现成插件。" },
          { date: "2026-08-12", text: "决定自建。信息架构：工作台、日历、甘特、汇总。" },
          { date: "2026-08-13", text: "先用 HTML 原型把交互定下来。" }
        ]
      },
      {
        id: "t2", type: "long", status: "doing",
        title: "Cursor 培养工程固化",
        start: "2026-06-01", end: "2026-12-31",
        desc: "把常用工作流收成 Skill / Rule / 手册。",
        logs: [
          { date: "2026-08-04", text: "补了一轮 CAPABILITIES 与用户手册同步。" },
          { date: "2026-08-11", text: "梳理 z-ones-bug 与 push 前自测门禁。" }
        ]
      },
      {
        id: "t3", type: "long", status: "todo",
        title: "liveSpace 知识库治理",
        start: "2026-09-01", end: "2026-10-15",
        desc: "按目录规范整理库，修断链、清孤立附件。",
        logs: []
      },
      {
        id: "t4", type: "long", status: "done",
        title: "Q2 绩效材料整理",
        start: "2026-06-20", end: "2026-07-05",
        desc: "按四维指标整理工作内容、评分说明和不足。",
        logs: [
          { date: "2026-06-28", text: "完成工作内容归档。" },
          { date: "2026-07-03", text: "提交评分说明。" }
        ]
      },
      {
        id: "t5", type: "temp", status: "doing",
        title: "修缺陷 #155325",
        start: "2026-08-12", end: "2026-08-15",
        desc: "按 ONES 单修前端展示问题，提 MR。",
        logs: [{ date: "2026-08-12", text: "复现并定位到布局区块未翻译。" }]
      },
      {
        id: "t6", type: "temp", status: "todo",
        title: "写本周周报",
        start: "2026-08-14", end: "2026-08-14",
        desc: "根据日记汇总本周产出。",
        logs: []
      },
      {
        id: "t7", type: "temp", status: "done",
        title: "插件方案调研",
        start: "2026-08-13", end: "2026-08-13",
        desc: "确认社区插件缺口后给出自建建议。",
        logs: [{ date: "2026-08-13", text: "完成调研并选择自建。" }]
      }
    ];

    const $ = (s) => document.querySelector(s);
    function pad(n) { return String(n).padStart(2, "0"); }
    function parse(d) { return new Date(d + "T00:00:00"); }
    function fmt(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
    function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
    function daysBetween(a, b) { return Math.round((b - a) / 86400000); }

    function periodRange() {
      const t = parse(TODAY);
      if (period === "week") {
        const day = (t.getDay() + 6) % 7;
        const start = addDays(t, -day);
        return { start, end: addDays(start, 6), label: "本周" };
      }
      if (period === "month") return { start: new Date(t.getFullYear(), t.getMonth(), 1), end: new Date(t.getFullYear(), t.getMonth() + 1, 0), label: "本月" };
      if (period === "quarter") {
        const q = Math.floor(t.getMonth() / 3) * 3;
        return { start: new Date(t.getFullYear(), q, 1), end: new Date(t.getFullYear(), q + 3, 0), label: "本季" };
      }
      return { start: new Date(t.getFullYear(), 0, 1), end: new Date(t.getFullYear(), 11, 31), label: "今年" };
    }

    function inRange(date, range) {
      const d = parse(date);
      return d >= range.start && d <= range.end;
    }

    function filtered() {
      return tasks.filter((t) =>
        (typeFilter === "all" || t.type === typeFilter) &&
        (statusFilter === "all" || t.status === statusFilter)
      );
    }

    function logsInPeriod() {
      const r = periodRange();
      return tasks.flatMap((t) => t.logs.filter((l) => inRange(l.date, r)).map((l) => ({ ...l, task: t })));
    }

    function logsOn(day) {
      return tasks.flatMap((t) => t.logs.filter((l) => l.date === day).map((l) => ({ ...l, task: t })));
    }

    function syncPeriod() {
      $("#period").classList.toggle("is-hidden", view === "board" || view === "cal");
    }

    function renderFilters() {
      $("#filters").innerHTML = `
        <button class="chip ${typeFilter === "all" ? "on" : ""}" data-k="all">全部</button>
        <button class="chip ${typeFilter === "long" ? "on" : ""}" data-k="long">长期</button>
        <button class="chip ${typeFilter === "temp" ? "on" : ""}" data-k="temp">临时</button>
        <select id="statusFilter">
          <option value="all">全部状态</option>
          <option value="todo">未开始</option>
          <option value="doing">进行中</option>
          <option value="done">已完结</option>
        </select>
      `;
      $("#statusFilter").value = statusFilter;
    }

    function renderList() {
      $("#taskList").innerHTML = ["long", "temp"].map((key) => {
        const items = filtered().filter((t) => t.type === key);
        if (!items.length) return "";
        return `<div class="group-title">${TYPE[key]}任务 · ${items.length}</div>` + items.map((t) => {
          const need = t.status === "doing" && !t.logs.some((l) => l.date === TODAY);
          return `<div class="task ${t.id === selectedId ? "sel" : ""}" data-id="${t.id}">
            <div class="rail ${t.type}"></div>
            <div>
              <h3>${t.title}</h3>
              <div class="meta">
                <span class="st ${t.status}">${STATUS[t.status]}</span>
                <span>${t.start} → ${t.end}</span>
                <span>${t.logs.length} 笔</span>
              </div>
            </div>
            ${need ? `<div class="need" title="今天还没记"></div>` : ""}
          </div>`;
        }).join("");
      }).join("") || `<p style="padding:20px;color:var(--muted)">没有符合筛选的任务</p>`;
    }

    function renderDetail() {
      const t = tasks.find((x) => x.id === selectedId);
      if (!t) {
        $("#detail").innerHTML = `<div class="detail-empty">选一条任务，在这里写今天的进展</div>`;
        return;
      }
      const logs = [...t.logs].sort((a, b) => b.date.localeCompare(a.date));
      $("#detail").innerHTML = `
        <div class="kicker">${TYPE[t.type]} · ${t.start} → ${t.end}</div>
        <div class="detail-head">
          <h1>${t.title}</h1>
          <div class="status-box">
            <label>状态</label>
            <select id="taskStatus">
              <option value="todo">未开始</option>
              <option value="doing">进行中</option>
              <option value="done">已完结</option>
            </select>
          </div>
        </div>
        <div class="meta"><span>${t.logs.length} 条进展</span></div>
        <p class="desc">${t.desc || "还没有说明"}</p>
        <div class="composer">
          <label>记今天 · ${TODAY}</label>
          <textarea id="logText" placeholder="今天做了什么、卡在哪里、下一步是什么"></textarea>
          <div class="composer-row">
            <button class="btn" id="addLog">记一笔</button>
          </div>
        </div>
        <div class="timeline">
          ${logs.map((l) => logRowHtml(l)).join("") || `<p style="color:var(--muted)">还没有进展，从上面记第一笔。</p>`}
        </div>
      `;
      $("#taskStatus").value = t.status;
      $("#taskStatus").onchange = () => {
        t.status = $("#taskStatus").value;
        renderList();
        renderDetail();
        renderGantt();
        renderCalendar();
      };
      $("#addLog").onclick = () => {
        const text = $("#logText").value.trim();
        if (!text) return;
        t.logs = t.logs.filter((l) => l.date !== TODAY);
        t.logs.push({ date: TODAY, text });
        if (t.status === "todo") t.status = "doing";
        editingLogDate = null;
        renderAll();
      };
      $("#detail").onclick = (e) => {
        const btn = e.target.closest("[data-act]");
        if (!btn) return;
        const row = btn.closest(".log");
        const date = row && row.dataset.date;
        if (!date) return;
        const act = btn.dataset.act;
        if (act === "edit-log") { editingLogDate = date; renderDetail(); }
        if (act === "cancel-log") { editingLogDate = null; renderDetail(); }
        if (act === "save-log") {
          const text = row.querySelector("textarea").value.trim();
          if (!text) return;
          const log = t.logs.find((l) => l.date === date);
          if (log) log.text = text;
          editingLogDate = null;
          renderAll();
        }
        if (act === "del-log") {
          if (!confirm("删除 " + date + " 这条进展？")) return;
          t.logs = t.logs.filter((l) => l.date !== date);
          if (editingLogDate === date) editingLogDate = null;
          renderAll();
        }
      };
    }

    function logRowHtml(l) {
      if (editingLogDate === l.date) {
        return `<div class="log" data-date="${l.date}">
          <time>${l.date}</time>
          <div class="log-body"><textarea class="log-edit">${l.text}</textarea></div>
          <div class="log-actions">
            <button class="btn" data-act="save-log" type="button">保存</button>
            <button class="ghost" data-act="cancel-log" type="button">取消</button>
          </div>
        </div>`;
      }
      return `<div class="log" data-date="${l.date}">
        <time>${l.date}</time>
        <div class="log-body"><p>${l.text}</p></div>
        <div class="log-actions">
          <button class="ghost" data-act="edit-log" type="button">编辑</button>
          <button class="btn-danger" data-act="del-log" type="button">删除</button>
        </div>
      </div>`;
    }

    function renderCalendar() {
      const y = calCursor.getFullYear();
      const m = calCursor.getMonth();
      $("#calTitle").textContent = `${y} 年 ${m + 1} 月`;
      const first = new Date(y, m, 1);
      const startOffset = (first.getDay() + 6) % 7;
      const gridStart = addDays(first, -startOffset);
      let html = "";
      for (let i = 0; i < 42; i++) {
        const d = addDays(gridStart, i);
        const key = fmt(d);
        const logs = logsOn(key);
        const cls = ["day", d.getMonth() !== m ? "out" : "", key === TODAY ? "today" : "", key === selectedDay ? "sel" : ""].join(" ");
        const items = logs.slice(0, 3).map((l) => `<div class="day-item">${l.task.title}</div>`).join("");
        const more = logs.length > 3 ? `<div class="day-item">+${logs.length - 3}</div>` : "";
        html += `<div class="${cls}" data-day="${key}"><div class="day-num">${d.getDate()}</div>${items}${more}</div>`;
      }
      $("#calDays").innerHTML = html;
      const dayLogs = logsOn(selectedDay);
      $("#dayPane").innerHTML = `<h2>${selectedDay}</h2>` + (dayLogs.length
        ? dayLogs.map((l) => `<div class="log"><time>${l.task.title}</time><p>${l.text}</p></div>`).join("")
        : `<p style="color:var(--muted)">这天还没有进展记录</p>`);
    }

    function ganttUnits(range) {
      const units = [];
      if (period === "week" || period === "month") {
        for (let d = new Date(range.start); d <= range.end; d = addDays(d, 1)) {
          units.push({ start: new Date(d), end: new Date(d), label: String(d.getDate()) });
        }
      } else if (period === "quarter") {
        let d = new Date(range.start);
        d = addDays(d, -((d.getDay() + 6) % 7));
        while (d <= range.end) {
          units.push({ start: new Date(d), end: addDays(d, 6), label: `${d.getMonth() + 1}/${d.getDate()}` });
          d = addDays(d, 7);
        }
      } else {
        for (let m = 0; m < 12; m++) {
          units.push({ start: new Date(range.start.getFullYear(), m, 1), end: new Date(range.start.getFullYear(), m + 1, 0), label: `${m + 1}月` });
        }
      }
      return units;
    }

    function renderGantt() {
      const r = periodRange();
      const units = ganttUnits(r);
      const hint = { week: "按天看本周", month: "按天看本月", quarter: "按周看本季", year: "按月看今年" }[period];
      $("#ganttHint").textContent = `${fmt(r.start)} 至 ${fmt(r.end)} · ${hint} · 竖线是有进展的日子`;
      const today = parse(TODAY);
      const todayIdx = units.findIndex((u) => today >= u.start && today <= u.end);
      const todayPct = todayIdx < 0 ? -1 : ((todayIdx + 0.5) / units.length) * 100;
      const rows = filtered();
      $("#gantt").innerHTML = `<div class="gantt">
        <div>
          <div class="gantt-head"></div>
          ${rows.map((t) => `<div class="gantt-row ${t.id === ganttTaskId ? "sel" : ""}" data-id="${t.id}">${t.title}</div>`).join("")}
        </div>
        <div style="position:relative">
          ${todayPct >= 0 ? `<div class="today-line" style="left:${todayPct}%"></div>` : ""}
          <div class="gantt-head">${units.map((u) => `<div class="col">${u.label}</div>`).join("")}</div>
          ${rows.map((t) => {
            const ts = parse(t.start), te = parse(t.end);
            const startIdx = units.findIndex((u) => te >= u.start && ts <= u.end);
            let endIdx = startIdx;
            for (let i = 0; i < units.length; i++) if (ts <= units[i].end && te >= units[i].start) endIdx = i;
            if (startIdx < 0) return `<div class="gantt-track" data-id="${t.id}"></div>`;
            const left = (startIdx / units.length) * 100;
            const width = Math.max(1.5, ((endIdx - startIdx + 1) / units.length) * 100);
            const ticks = t.logs.map((l) => {
              const d = parse(l.date);
              const i = units.findIndex((u) => d >= u.start && d <= u.end);
              if (i < 0) return "";
              const p = ((i - startIdx + 0.4) / Math.max(1, endIdx - startIdx + 1)) * 100;
              return `<i class="tick" title="${l.date}: ${l.text}" style="left:${Math.min(96, Math.max(2, p))}%"></i>`;
            }).join("");
            return `<div class="gantt-track" data-id="${t.id}"><div class="bar ${t.type} ${t.status}" style="left:${left}%;width:${width}%">${ticks}</div></div>`;
          }).join("")}
        </div>
      </div>`;
      const focus = tasks.find((t) => t.id === ganttTaskId) || rows[0];
      const logs = focus ? focus.logs.filter((l) => inRange(l.date, r)).sort((a, b) => b.date.localeCompare(a.date)) : [];
      $("#ganttLogs").innerHTML = focus
        ? `<strong>${focus.title} · ${r.label}做了什么</strong>${logs.map((l) => `<div class="log"><time>${l.date}</time><p>${l.text}</p></div>`).join("") || `<p style="color:var(--muted)">这个周期还没有进展</p>`}`
        : "";
    }

    function renderReport() {
      const r = periodRange();
      const logs = logsInPeriod().sort((a, b) => b.date.localeCompare(a.date));
      const byTask = {};
      logs.forEach((l) => { byTask[l.task.title] = (byTask[l.task.title] || 0) + 1; });
      const countByDay = {};
      logs.forEach((l) => { countByDay[l.date] = (countByDay[l.date] || 0) + 1; });
      let heat = "";
      const heatDays = daysBetween(r.start, r.end) + 1;
      for (let i = 0; i < Math.min(heatDays, 370); i++) {
        const d = fmt(addDays(r.start, i));
        const n = countByDay[d] || 0;
        heat += `<i class="${n >= 3 ? "l3" : n === 2 ? "l2" : n === 1 ? "l1" : ""}" title="${d} · ${n} 笔"></i>`;
      }
      $("#report").innerHTML = `
        <div class="card">
          <h2>${r.label}进展明细</h2>
          <table>
            <thead><tr><th>日期</th><th>任务</th><th>做了什么</th></tr></thead>
            <tbody>${logs.map((l) => `<tr><td>${l.date}</td><td>${l.task.title}</td><td>${l.text}</td></tr>`).join("") || `<tr><td colspan="3">这个周期还没有记录</td></tr>`}</tbody>
          </table>
        </div>
        <div>
          <div class="card" style="margin-bottom:12px"><h2>活跃分布</h2><div class="heat">${heat}</div></div>
          <div class="card"><h2>按任务计数</h2><table>${Object.entries(byTask).map(([k, v]) => `<tr><td>${k}</td><td>${v} 笔</td></tr>`).join("") || "<tr><td>暂无</td></tr>"}</table></div>
        </div>
      `;
    }

    function renderAll() {
      syncPeriod();
      renderFilters();
      renderList();
      renderDetail();
      renderCalendar();
      renderGantt();
      renderReport();
    }

    $("#tabs").onclick = (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      view = btn.dataset.view;
      [...$("#tabs").children].forEach((b) => b.classList.toggle("on", b === btn));
      ["board", "cal", "gantt", "report"].forEach((v) => $("#view-" + v).classList.toggle("on", v === view));
      syncPeriod();
    };

    $("#period").onclick = (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      period = btn.dataset.p;
      [...$("#period").children].forEach((b) => b.classList.toggle("on", b === btn));
      renderGantt();
      renderReport();
    };

    $("#filters").addEventListener("click", (e) => {
      const btn = e.target.closest("button.chip");
      if (!btn) return;
      typeFilter = btn.dataset.k;
      renderAll();
    });
    $("#filters").addEventListener("change", (e) => {
      if (e.target.id !== "statusFilter") return;
      statusFilter = e.target.value;
      renderAll();
    });

    $("#taskList").addEventListener("click", (e) => {
      const row = e.target.closest(".task");
      if (!row) return;
      if (selectedId !== row.dataset.id) editingLogDate = null;
      selectedId = row.dataset.id;
      renderAll();
    });

    $("#calDays").addEventListener("click", (e) => {
      const day = e.target.closest(".day");
      if (!day) return;
      selectedDay = day.dataset.day;
      renderCalendar();
    });
    $("#calPrev").onclick = () => { calCursor.setMonth(calCursor.getMonth() - 1); renderCalendar(); };
    $("#calNext").onclick = () => { calCursor.setMonth(calCursor.getMonth() + 1); renderCalendar(); };
    $("#calToday").onclick = () => { calCursor = new Date(2026, 7, 13); selectedDay = TODAY; renderCalendar(); };

    $("#gantt").addEventListener("click", (e) => {
      const row = e.target.closest("[data-id]");
      if (!row) return;
      ganttTaskId = row.dataset.id;
      renderGantt();
    });

    const modal = $("#modal");
    $("#newBtn").onclick = () => {
      const form = $("#newForm");
      form.start.value = TODAY;
      form.end.value = "2026-08-27";
      modal.showModal();
    };
    $("#cancelNew").onclick = () => modal.close();
    $("#newForm").onsubmit = (e) => {
      e.preventDefault();
      const f = e.target;
      const id = "t" + Date.now();
      tasks.unshift({
        id, title: f.title.value.trim(), desc: f.desc.value.trim(),
        type: f.type.value, status: f.status.value,
        start: f.start.value, end: f.end.value, logs: []
      });
      selectedId = id;
      modal.close();
      f.reset();
      renderAll();
    };

    renderAll();
  </script>
</body>
</html>
